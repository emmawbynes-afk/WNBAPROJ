name: Daily data update
on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Get the repository files
        uses: actions/checkout@v4
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::wehoop
            any::tidyverse
            any::writexl
      - name: Update team data and poll history
        run: Rscript update_data(3).R
        continue-on-error: true
      - name: Update player data and story lists
        run: Rscript update_players(2).R
        continue-on-error: true
      - name: Save results to the repository
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p output
          git add output
          git diff --staged --quiet || git commit -m "Daily update"
          git pull --rebase
          git push
