   name: Daily data update
.github/workflows/daily.yml
on:
  schedule:
    # Runs every day at 11:00 UTC (about 6-7 am Eastern, depending on daylight saving).
    # Format is: minute hour day month weekday. All times are UTC.
    - cron: "0 11 * * *"
  # Adds a "Run workflow" button so you can test it any time
  workflow_dispatch:

permissions:
  contents: write   # lets the workflow save the updated files back to the repo

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Get the repository files
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::wehoop
            any::tidyverse
            any::writexl

      # continue-on-error means that if a script stops (for example, "no games yet"
      # in the offseason), the workflow still saves whatever was produced.
      - name: Update team data and poll history
        run: Rscript update_data.R
        continue-on-error: true

      - name: Update player data and story lists
        run: Rscript update_players.R
        continue-on-error: true

      - name: Save results to the repository
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output
          git diff --staged --quiet || git commit -m "Daily update $(date -u +%F)"
          git push
